[package]
name = "bdmv-remuxer"
version = "1.0.0"
description = "BDMV to MKV Remuxer Application"
authors = ["Judas"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["dialog-open", "dialog-save", "dialog-confirm", "fs-all", "path-all", "shell-open", "process-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
walkdir = "2.4"
regex = "1.10"
xml-rs = "0.8"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
parking_lot = "0.12"
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
