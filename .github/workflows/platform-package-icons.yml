name: Native package checks

on:
  pull_request:
    paths:
      - ".github/workflows/platform-package-icons.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-icons.mjs"
      - "scripts/check-icon-artwork.mjs"
      - "scripts/check-icon-artwork.test.mjs"
      - "scripts/preview-icons.mjs"
      - "index.html"
      - "scripts/verify-platform-icons.mjs"
      - "scripts/smoke-macos-window.swift"
      - "scripts/smoke-macos-recovery.sh"
      - "scripts/smoke-windows-interface.ps1"
      - "scripts/smoke-installed-close.ps1"
      - "src/**"
      - "src-tauri/**"
      - "vite.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/platform-package-icons.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-icons.mjs"
      - "scripts/check-icon-artwork.mjs"
      - "scripts/check-icon-artwork.test.mjs"
      - "scripts/preview-icons.mjs"
      - "index.html"
      - "scripts/verify-platform-icons.mjs"
      - "scripts/smoke-macos-window.swift"
      - "scripts/smoke-macos-recovery.sh"
      - "scripts/smoke-windows-interface.ps1"
      - "scripts/smoke-installed-close.ps1"
      - "src/**"
      - "src-tauri/**"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-icons:
    name: Verify generated platform icons
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check generated icons against the SVG source
        run: npm run icons:check
      - name: Check 16px and 32px source artwork contrast
        run: |
          npm run icons:artwork-check
          npm run test:icon-artwork

  windows:
    name: Windows MSI install and launch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/verify-platform-icons.mjs
      - name: Test settings replacement and Rust suite on Windows
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build pre-upgrade Windows installer
        run: npm run tauri -- build --bundles msi --config '{"package":{"version":"0.9.0"}}' --ci
      - name: Preserve pre-upgrade MSI for upgrade verification
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File |
            Select-Object -First 1
          if (-not $msi) { throw "Tauri did not produce the pre-upgrade Windows MSI." }
          Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $env:RUNNER_TEMP "bdmv-remuxer-0.9.0.msi")
          Remove-Item "src-tauri/target/release/bundle/msi/*.msi" -Force
      - name: Build current Windows installer
        run: npm run tauri -- build --bundles msi --ci
      - name: Upgrade the installed app and verify saved preferences
        shell: pwsh
        run: |
          $oldMsi = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-0.9.0.msi"
          $currentMsi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File |
            Select-Object -First 1
          if (-not (Test-Path $oldMsi)) { throw "The pre-upgrade MSI is missing: $oldMsi" }
          if (-not $currentMsi) { throw "Tauri did not produce the current Windows MSI." }

          $installDir = Join-Path $env:RUNNER_TEMP "bdmv remuxer installed"
          $oldInstall = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$oldMsi`" /qn /norestart INSTALLDIR=`"$installDir`"" `
            -Wait -PassThru
          if ($oldInstall.ExitCode -notin @(0, 3010)) {
            throw "Pre-upgrade MSI installation failed with exit code $($oldInstall.ExitCode)."
          }

          $exe = Join-Path $installDir "bdmv-remuxer.exe"
          if (-not (Test-Path $exe)) {
            throw "The pre-upgrade MSI did not install the application at $exe."
          }

          $seedReport = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-settings-seed.log"
          Remove-Item $seedReport -Force -ErrorAction SilentlyContinue
          & $exe --smoke-settings-upgrade seed $seedReport
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $seedReport)) {
            if (Test-Path $seedReport) { Get-Content -LiteralPath $seedReport | Write-Host }
            throw "The older installed app could not save the non-default preferences."
          }
          Get-Content -LiteralPath $seedReport | Write-Host

          $upgrade = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$($currentMsi.FullName)`" /qn /norestart INSTALLDIR=`"$installDir`"" `
            -Wait -PassThru
          if ($upgrade.ExitCode -notin @(0, 3010)) {
            throw "Upgrading to the current MSI failed with exit code $($upgrade.ExitCode)."
          }
          if (-not (Test-Path $exe)) {
            throw "The upgraded MSI did not leave the application at $exe."
          }

          $verifyReport = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-settings-verify.log"
          Remove-Item $verifyReport -Force -ErrorAction SilentlyContinue
          & $exe --smoke-settings-upgrade verify $verifyReport
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $verifyReport)) {
            if (Test-Path $verifyReport) { Get-Content -LiteralPath $verifyReport | Write-Host }
            throw "The upgraded app did not reload all saved preferences."
          }
          $report = Get-Content -LiteralPath $verifyReport -Raw
          Write-Host $report
          foreach ($expected in @(
            "Upgrade Episodes",
            "Upgrade Specials",
            "1845",
            "147",
            "83",
            "117"
          )) {
            if ($report -notlike "*$expected*") {
              throw "The upgraded app's loaded-preferences report did not include '$expected'."
            }
          }
          Write-Host "Verified that a real MSI upgrade preserves and reloads all non-default preferences."
      - name: Verify blank-interface smoke check rejects a missing heading
        shell: pwsh
        run: |
          $output = & pwsh -NoProfile -File scripts/smoke-windows-interface.ps1 -TestMissingHeading 2>&1
          $status = $LASTEXITCODE
          $diagnostic = $output -join "`n"
          if ($status -ne 3) {
            throw "The missing-heading check exited with $status instead of 3. Output: $diagnostic"
          }
          if (
            $diagnostic -notlike "*main interface heading was not found*" -or
            $diagnostic -notlike "*The webview may be blank or failed to load.*"
          ) {
            throw "The missing-heading check did not report the blank-interface diagnostic. Output: $diagnostic"
          }
          Write-Host "Verified the Windows blank-interface check exits 3 and reports the missing heading."
      - name: Verify installer and executable icon
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File
          if (-not $msi) { throw "Tauri did not produce a Windows MSI package." }

          $exe = Resolve-Path "src-tauri/target/release/bdmv-remuxer.exe"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.Path)
          if (-not $icon) { throw "The packaged application executable has no readable icon resource." }
          if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "The executable icon is too small: $($icon.Width)x$($icon.Height)."
          }
          Write-Host "Verified $($msi.Count) MSI package(s) and executable icon: $($icon.Width)x$($icon.Height)."
      - name: Verify the upgraded app renders its main interface
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\scripts\smoke-windows-interface.ps1"
          $installDir = Join-Path $env:RUNNER_TEMP "bdmv remuxer installed"
          $exe = Join-Path $installDir "bdmv-remuxer.exe"
          if (-not (Test-Path $exe)) {
            throw "The MSI completed but did not install the application at $exe."
          }

          Add-Type -AssemblyName System.Drawing
          $iconPng = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-installed-icon.png"
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $icon) {
            throw "The application installed from the MSI has no readable icon resource."
          }
          $bitmap = $icon.ToBitmap()
          try {
            $bitmap.Save($iconPng, [System.Drawing.Imaging.ImageFormat]::Png)
          }
          finally {
            $bitmap.Dispose()
            $icon.Dispose()
          }
          node scripts/verify-platform-icons.mjs --packaged-icon-png $iconPng
          if ($LASTEXITCODE -ne 0) {
            throw "The application icon installed from the MSI does not match the checked-in icon artwork."
          }

          $app = Start-Process -FilePath $exe -PassThru
          try {
            $windowOpened = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) {
                throw "The installed application exited during startup with code $($app.ExitCode)."
              }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
                $windowOpened = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $windowOpened) {
              throw "The installed application stayed running but did not open its main window within 60 seconds."
            }
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $interfaceRendered = $false
            $uiAutomationError = $null
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) {
                throw "The installed application exited while its main interface was loading with code $($app.ExitCode)."
              }
              if ($app.MainWindowHandle -eq [IntPtr]::Zero) {
                throw "The installed application closed its main window while its main interface was loading."
              }
              try {
                $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
                $headingCondition = [System.Windows.Automation.PropertyCondition]::new(
                  [System.Windows.Automation.AutomationElement]::NameProperty,
                  "BDMV Remuxer main interface"
                )
                $heading = $window.FindFirst(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $headingCondition
                )
                if ($null -ne $heading) {
                  $interfaceRendered = $true
                  break
                }
              }
              catch {
                $uiAutomationError = $_.Exception.Message
              }
              Start-Sleep -Seconds 1
            }
            if (-not $interfaceRendered) {
              $message = Get-MissingInterfaceHeadingDiagnostic -InterfaceRendered:$interfaceRendered
              if ($uiAutomationError) {
                $message += " UI Automation error: $uiAutomationError"
              }
              throw $message
            }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited) {
              throw "The installed application exited shortly after rendering its main interface."
            }
            if ($app.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "The installed application closed its main window during the startup check."
            }
            Write-Host "The installed Windows application rendered its main interface."
          }
          finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Install MKVToolNix for the packaged remux check
        run: choco install mkvtoolnix --no-progress --yes
      - name: Verify installed recovery opens the newly preserved backup
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "bdmv remuxer installed\bdmv-remuxer.exe"
          $smokeDir = Join-Path $env:RUNNER_TEMP "bdmv recuperación smoke"
          $configDir = Join-Path $smokeDir "configuración"
          $report = Join-Path $smokeDir "recovery.log"
          $capture = Join-Path $smokeDir "opened-path.txt"
          $captureScript = Join-Path $smokeDir "capture-opened-path.ps1"
          $settings = Join-Path $configDir "settings.json"
          $olderBackup = Join-Path $configDir "settings.json.corrupt"
          $expectedBackup = Join-Path $configDir "settings.json.corrupt.1"
          $extensionKey = "HKCU:\Software\Classes\.1"
          $programKey = "HKCU:\Software\Classes\BdmvRemuxerRecoverySmoke"
          $commandKey = Join-Path $programKey "shell\open\command"
          $program = "BdmvRemuxerRecoverySmoke"

          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          [System.IO.File]::WriteAllText($settings, "{ malformed preferences")
          [System.IO.File]::WriteAllText($olderBackup, "older recovery copy")
          $olderBackupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $olderBackup).Hash
          $captureLiteral = $capture.Replace("'", "''")
          @"
          param([string]`$Path)
          [System.IO.File]::WriteAllText('$captureLiteral', `$Path)
          "@ | Set-Content -LiteralPath $captureScript -Encoding UTF8

          try {
            New-Item -Path $extensionKey -Force | Out-Null
            Set-Item -Path $extensionKey -Value $program
            New-Item -Path $commandKey -Force | Out-Null
            $powershell = (Get-Command powershell.exe -ErrorAction Stop).Source
            $handler = "`"$powershell`" -NoProfile -ExecutionPolicy Bypass -File `"$captureScript`" `"%1`""
            Set-Item -Path $commandKey -Value $handler

            Remove-Item $report, $capture -Force -ErrorAction SilentlyContinue
            & $exe --smoke-settings-recovery $configDir $report
            $smokeExitCode = $LASTEXITCODE
            if ($smokeExitCode -ne 0) {
              if (Test-Path $report) { Get-Content $report | Write-Host }
              throw "The installed app recovery smoke failed with exit code $smokeExitCode."
            }
            if (-not (Test-Path $report)) {
              throw "The installed app did not create its recovery smoke report."
            }
            $reportText = Get-Content -LiteralPath $report -Raw
            Write-Host $reportText
            if ($reportText -notmatch [regex]::Escape($expectedBackup)) {
              throw "The installed app did not report the newly preserved backup path: $expectedBackup"
            }

            $handlerReceivedPath = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Test-Path $capture) {
                $openedPath = [System.IO.File]::ReadAllText($capture)
                if ([string]::Equals(
                  $openedPath,
                  $expectedBackup,
                  [System.StringComparison]::Ordinal
                )) {
                  $handlerReceivedPath = $true
                  break
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $handlerReceivedPath) {
              $actualPath = if (Test-Path $capture) {
                [System.IO.File]::ReadAllText($capture)
              } else {
                "The registered Windows file handler was never launched."
              }
              throw "The installed app did not open the newly preserved backup. Expected '$expectedBackup'; received '$actualPath'."
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $olderBackup).Hash -ne $olderBackupHash) {
              throw "Opening the recovered backup changed the pre-existing backup."
            }
            if ([System.IO.File]::ReadAllText($expectedBackup) -cne "{ malformed preferences") {
              throw "The newly preserved backup contents changed during the open check."
            }
            Write-Host "The installed app opened the newly preserved backup, and both backup files remain unchanged."
          }
          finally {
            Remove-Item $extensionKey, $programKey -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Run a remux with the installed Windows application
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "bdmv remuxer installed\bdmv-remuxer.exe"
          $mkvmerge = (Get-Command mkvmerge.exe -ErrorAction Stop).Source
          $fixture = Join-Path $env:GITHUB_WORKSPACE "src-tauri\tests\fixtures\remux-multitrack-smoke-input.mkv"
          $output = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-smoke-output.mkv"
          $stagedOutput = Join-Path (Split-Path -Parent $output) (".{0}.partial.mkv" -f (Split-Path -Leaf $output))
          $report = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-smoke.log"

          if (-not (Test-Path $exe)) { throw "The installed application executable is missing: $exe" }
          if (-not (Test-Path $fixture)) { throw "The remux smoke fixture is missing: $fixture" }
          Remove-Item $stagedOutput, $report -Force -ErrorAction SilentlyContinue
          $existingOutputContents = "existing output that must be replaced"
          Set-Content -LiteralPath $output -Value $existingOutputContents -NoNewline
          if ((Get-Content -LiteralPath $output -Raw) -cne $existingOutputContents) {
            throw "The smoke check failed to create its existing destination file."
          }
          & $exe --smoke-remux $mkvmerge $fixture $output $report
          $smokeExitCode = $LASTEXITCODE
          if (Test-Path $report) { Get-Content $report | Write-Host }
          if ($smokeExitCode -ne 0) {
            throw "The installed app's remux smoke failed with exit code $smokeExitCode."
          }
          if (-not (Test-Path $output) -or (Get-Item $output).Length -eq 0) {
            throw "The installed app did not produce a non-empty remux output."
          }
          if (Test-Path $stagedOutput) {
            throw "The installed app left a staged partial output behind: $stagedOutput"
          }

          $probeLog = Join-Path $env:RUNNER_TEMP "bdmv-remuxer-smoke-probe.log"
          $probeJson = & $mkvmerge -J $output 2>&1
          $probeExitCode = $LASTEXITCODE
          $probeJson | Set-Content $probeLog
          if ($probeExitCode -ne 0) {
            Get-Content $probeLog | Write-Host
            throw "mkvmerge could not inspect the remux output (exit code $probeExitCode)."
          }
          $probe = (Get-Content $probeLog -Raw) | ConvertFrom-Json
          $videoTracks = @($probe.tracks | Where-Object { $_.type -eq "video" })
          $audioTracks = @($probe.tracks | Where-Object { $_.type -eq "audio" })
          $subtitleTracks = @($probe.tracks | Where-Object { $_.type -eq "subtitles" })
          if (
            $probe.container.type -notmatch "Matroska" -or
            $videoTracks.Count -ne 1 -or
            $audioTracks.Count -ne 2 -or
            $subtitleTracks.Count -ne 2
          ) {
            Get-Content $probeLog | Write-Host
            throw "The remux output must contain one video, two audio, and two subtitle tracks."
          }
          $expectedTracks = @(
            @{ Type = "audio"; Language = "eng"; Name = "Selected English Audio" },
            @{ Type = "audio"; Language = "jpn"; Name = "Selected Japanese Commentary" },
            @{ Type = "subtitles"; Language = "eng"; Name = "Selected English Captions" },
            @{ Type = "subtitles"; Language = "jpn"; Name = "Selected Japanese Captions" }
          )
          foreach ($expected in $expectedTracks) {
            $matches = @($probe.tracks | Where-Object {
              $_.type -eq $expected.Type -and
              $_.properties.language -eq $expected.Language -and
              $_.properties.track_name -eq $expected.Name
            })
            if ($matches.Count -ne 1) {
              Get-Content $probeLog | Write-Host
              throw "The remux output is missing the expected $($expected.Type) track '$($expected.Name)' ($($expected.Language))."
            }
          }
          Write-Host "Verified installed-app remux output: one video, two audio, two subtitle tracks, and all selected language/name settings."
      - name: Verify native close waits for the active file and resumes the queue
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "bdmv remuxer installed\bdmv-remuxer.exe"
          $mkvmerge = (Get-Command mkvmerge.exe -ErrorAction Stop).Source
          $fixture = Join-Path $env:GITHUB_WORKSPACE "src-tauri\tests\fixtures\remux-smoke-input.mkv"
          $work = Join-Path $env:RUNNER_TEMP "bdmv remuxer close smoke"
          & "$env:GITHUB_WORKSPACE\scripts\smoke-installed-close.ps1" `
            -Executable $exe `
            -Mkvmerge $mkvmerge `
            -Fixture $fixture `
            -WorkDirectory $work

  macos:
    name: macOS DMG mount and app launch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/verify-platform-icons.mjs
      - name: Test recovery opener errors and Rust behavior on macOS
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Build macOS app and disk image
        run: npm run tauri -- build --bundles app,dmg --ci
      - name: Verify packaged app icon metadata
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$app" || { echo "Tauri did not produce a macOS .app bundle." >&2; exit 1; }
          test -n "$dmg" || { echo "Tauri did not produce a macOS disk image." >&2; exit 1; }

          verify_app_icon() {
            local app_path="$1"
            local icon_name icon_path
            icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_path/Contents/Info.plist")"
            icon_path="$app_path/Contents/Resources/$icon_name"
            if [ ! -f "$icon_path" ] && [ -f "$icon_path.icns" ]; then
              icon_path="$icon_path.icns"
            fi
            test -f "$icon_path" || {
              echo "The app's CFBundleIconFile does not exist in Contents/Resources: $app_path" >&2
              return 1
            }
            node scripts/verify-platform-icons.mjs --packaged-icns "$icon_path"
          }
          verify_app_icon "$app"

          mount_point="$RUNNER_TEMP/bdmv-remuxer-icon-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null
          cleanup_icon_dmg() {
            hdiutil detach "$mount_point" -quiet || hdiutil detach -force "$mount_point" -quiet || true
          }
          trap cleanup_icon_dmg EXIT
          dmg_app="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$dmg_app" || { echo "The DMG does not contain a macOS app bundle." >&2; exit 1; }
          verify_app_icon "$dmg_app"
          hdiutil verify "$dmg"
          echo "Verified app bundle and DMG icon artwork and disk image: $dmg"
      - name: Mount DMG and verify the app renders its main interface
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          mount_point="$RUNNER_TEMP/bdmv-remuxer-dmg"
          checker="$RUNNER_TEMP/check-bdmv-remuxer-window"
          bundle_id="com.bdmv-remuxer.app"
          app_pid=""

          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null
          cleanup() {
            if [ -n "$app_pid" ]; then
              kill -TERM "$app_pid" >/dev/null 2>&1 || true
              for _ in {1..10}; do
                kill -0 "$app_pid" >/dev/null 2>&1 || break
                sleep 0.5
              done
            fi
            hdiutil detach "$mount_point" -quiet || hdiutil detach -force "$mount_point" -quiet || true
          }
          trap cleanup EXIT

          app="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app" || { echo "The mounted DMG does not contain a macOS app bundle." >&2; exit 1; }

          swiftc scripts/smoke-macos-window.swift -o "$checker"
          set +e
          failure_output="$("$checker" --test-missing-heading 2>&1)"
          checker_status=$?
          set -e
          if [ "$checker_status" -ne 3 ]; then
            echo "The missing-heading check exited with $checker_status instead of 3." >&2
            echo "$failure_output" >&2
            exit 1
          fi
          if ! grep -Fq "main interface heading" <<< "$failure_output" ||
             ! grep -Fq "The webview may be blank, may have failed to load" <<< "$failure_output"; then
            echo "The missing-heading check did not report the blank-interface diagnostic." >&2
            echo "$failure_output" >&2
            exit 1
          fi

          set +e
          failure_output="$("$checker" --test-accessibility-failure 2>&1)"
          checker_status=$?
          set -e
          if [ "$checker_status" -ne 4 ]; then
            echo "The accessibility-failure check exited with $checker_status instead of 4." >&2
            echo "$failure_output" >&2
            exit 1
          fi
          if ! grep -Fq "macOS accessibility inspection failed" <<< "$failure_output" ||
             ! grep -Fq "AX error -25211" <<< "$failure_output" ||
             grep -Fq "webview may be blank" <<< "$failure_output"; then
            echo "The accessibility-failure check did not report a platform inspection failure separately." >&2
            echo "$failure_output" >&2
            exit 1
          fi
          open -n "$app"

          window_opened=false
          for _ in {1..60}; do
            if app_pid="$("$checker" "$bundle_id" 2>/dev/null)"; then
              window_opened=true
              break
            fi
            sleep 1
          done

          if [ "$window_opened" != true ]; then
            set +e
            "$checker" "$bundle_id"
            checker_status=$?
            set -e
            case "$checker_status" in
              2) echo "The app exited or did not start from the mounted DMG." >&2 ;;
              3) echo "The app opened a visible window, but its main interface did not render within 60 seconds." >&2 ;;
              4) echo "macOS accessibility inspection failed; interface rendering could not be determined." >&2 ;;
              *) echo "The app remained open but did not create a visible main window within 60 seconds." >&2 ;;
            esac
            exit 1
          fi

          sleep 3
          set +e
          app_pid="$("$checker" "$bundle_id")"
          checker_status=$?
          set -e
          if [ "$checker_status" -ne 0 ]; then
            if [ "$checker_status" -eq 3 ]; then
              echo "The app's main interface was no longer accessible after startup." >&2
            elif [ "$checker_status" -eq 4 ]; then
              echo "macOS accessibility inspection failed after startup; interface rendering could not be determined." >&2
            else
              echo "The app did not keep its main window open after startup." >&2
            fi
            exit 1
          fi

          echo "The app launched from the mounted DMG and rendered its main interface."
      - name: Verify recovery opens the preserved backup from the mounted DMG app
        shell: bash
        run: |
          brew install duti
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg" || { echo "Tauri did not produce a macOS disk image." >&2; exit 1; }
          bash scripts/smoke-macos-recovery.sh "$dmg" "$RUNNER_TEMP/bdmv-remuxer-recovery-smoke"
      - name: Install MKVToolNix for the packaged remux check
        run: brew install mkvtoolnix
      - name: Run a remux with the app bundled in the mounted DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          mount_point="$RUNNER_TEMP/bdmv-remuxer-remux-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$dmg" >/dev/null
          cleanup() {
            hdiutil detach "$mount_point" -quiet || hdiutil detach -force "$mount_point" -quiet || true
          }
          trap cleanup EXIT

          app="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
          binary="$app/Contents/MacOS/bdmv-remuxer"
          mkvmerge="$(command -v mkvmerge)"
          fixture="$GITHUB_WORKSPACE/src-tauri/tests/fixtures/remux-multitrack-smoke-input.mkv"
          output="$RUNNER_TEMP/bdmv-remuxer-smoke-output.mkv"
          staged_output="$RUNNER_TEMP/.$(basename "$output").partial.mkv"
          report="$RUNNER_TEMP/bdmv-remuxer-smoke.log"
          probe_log="$RUNNER_TEMP/bdmv-remuxer-smoke-probe.log"
          test -x "$binary" || { echo "The mounted app executable is missing: $binary" >&2; exit 1; }
          test -f "$fixture" || { echo "The remux smoke fixture is missing: $fixture" >&2; exit 1; }
          rm -f "$staged_output" "$report" "$probe_log"
          existing_output_contents="existing output that must be replaced"
          printf '%s' "$existing_output_contents" >"$output"
          test "$(cat "$output")" = "$existing_output_contents" || {
            echo "The smoke check failed to create its existing destination file." >&2
            exit 1
          }

          if ! "$binary" --smoke-remux "$mkvmerge" "$fixture" "$output" "$report"; then
            cat "$report" 2>/dev/null || true
            exit 1
          fi
          cat "$report"
          test -s "$output" || { echo "The installed app did not produce a non-empty remux output." >&2; exit 1; }
          test ! -e "$staged_output" || {
            echo "The installed app left a staged partial output behind: $staged_output" >&2
            exit 1
          }
          if ! "$mkvmerge" -J "$output" >"$probe_log" 2>&1; then
            cat "$probe_log" >&2
            echo "mkvmerge could not inspect the remux output." >&2
            exit 1
          fi
          cat "$probe_log"
          jq -e '
            (.container.type | test("Matroska")) and
            ([.tracks[] | select(.type == "video")] | length == 1) and
            ([.tracks[] | select(.type == "audio")] | length == 2) and
            ([.tracks[] | select(.type == "subtitles")] | length == 2) and
            any(.tracks[]; .type == "audio" and .properties.language == "eng" and .properties.track_name == "Selected English Audio") and
            any(.tracks[]; .type == "audio" and .properties.language == "jpn" and .properties.track_name == "Selected Japanese Commentary") and
            any(.tracks[]; .type == "subtitles" and .properties.language == "eng" and .properties.track_name == "Selected English Captions") and
            any(.tracks[]; .type == "subtitles" and .properties.language == "jpn" and .properties.track_name == "Selected Japanese Captions")
          ' "$probe_log" >/dev/null || {
            echo "The remux output is missing expected video, audio, subtitle, language, or track-name metadata." >&2
            exit 1
          }
          echo "Verified installed-app remux output: one video, two audio, two subtitle tracks, and all selected language/name settings."
